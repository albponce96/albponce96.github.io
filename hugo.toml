baseURL = 'https://albponce96.github.io/'
languageCode = 'es-es'
title = 'Albert Ponce Villegas'
theme = 'PaperMod'

# Paginación
[pagination]
  pagerSize = 10

# Habilitar features
enableInlineShortcodes = true
enableRobotsTXT = true

[params]
  description = "Albert Moises Ponce Villegas — Consultor en Sostenibilidad y especialista en Monitoreo, Evaluación y Aprendizaje (MEL)."
  author = "Albert Ponce Villegas"

  defaultTheme = "auto"
  ShowShareButtons = false
  ShowReadingTime = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = false
  ShowToc = false
  DateFormat = "2006"

  # Perfil en la home (modo landing page)
  [params.profileMode]
    enabled = true
    title = "Albert Moises Ponce Villegas"
    subtitle = "Consultor en Sostenibilidad · Monitoreo, Evaluación y Aprendizaje (MEL)<br>Lima, Perú"
    imageUrl = "/images/profile.jpg"
    imageWidth = 150
    imageHeight = 150
    imageTitle = "Albert Ponce Villegas"

    [[params.profileMode.buttons]]
      name = "About me"
      url = "about"
    [[params.profileMode.buttons]]
      name = "Research"
      url = "research"
    [[params.profileMode.buttons]]
      name = "Consultancy"
      url = "consultancy"
    [[params.profileMode.buttons]]
      name = "Teaching"
      url = "teaching"
    [[params.profileMode.buttons]]
      name = "Projects"
      url = "projects"

  # Enlaces sociales (aparecen bajo el perfil)
  [[params.socialIcons]]
    name = "email"
    title = "Correo electrónico"
    url = "mailto:aponce@cedepperu.org"
  [[params.socialIcons]]
    name = "googlescholar"
    title = "Google Scholar"
    url = "https://scholar.google.com/citations?user=l4y-ybsAAAAJ&hl=es"
  [[params.socialIcons]]
    name = "medium"
    title = "Medium"
    url = "https://albponce.medium.com"
  [[params.socialIcons]]
    name = "cv"
    title = "Descargar CV (PDF)"
    url = "/cv.pdf"

# Menú de navegación superior
[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "research"
    name = "Research"
    url = "/research/"
    weight = 20
  [[menu.main]]
    identifier = "consultancy"
    name = "Consultancy"
    url = "/consultancy/"
    weight = 30
  [[menu.main]]
    identifier = "teaching"
    name = "Teaching"
    url = "/teaching/"
    weight = 40
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 50

# Permitir HTML en Markdown
[markup.goldmark.renderer]
  unsafe = true
