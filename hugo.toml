baseURL = 'https://albponce96.github.io/'
languageCode = 'es-es'
title = 'Albert Ponce Villegas'
theme = 'PaperMod'

# Paginación
[pagination]
  pagerSize = 10

# Habilitar features
enableInlineShortcodes = true
enableRobotsTXT = true

[params]
  description = "Albert Ponce Villegas — Especialista en Sostenibilidad y Monitoreo, Evaluación y Aprendizaje (MEL)."
  author = "Albert Ponce Villegas"

  defaultTheme = "auto"
  ShowShareButtons = false
  ShowReadingTime = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = false
  ShowToc = false
  DateFormat = "2006"

  # Perfil en la home (modo landing page)
  [params.profileMode]
    enabled = true
    title = "Albert Ponce Villegas"
    subtitle = '''<span class="home-role">Especialista en Sostenibilidad y Monitoreo, Evaluación y Aprendizaje (MEL)</span><span class="home-desc">Economista y Administrador con más de 6 años de experiencia en planificación estratégica, análisis socioeconómico y sistemas de monitoreo (MRV) para proyectos de sostenibilidad y adaptación climática.</span><span class="home-stats"><span class="stat"><b>8</b><small>Publicaciones</small><em>+ USD 5 mil en financiamiento</em></span><span class="stat"><b>4</b><small>Ponencias</small><em>En congresos y simposios nacionales</em></span><span class="stat"><b>4</b><small>Consultorías</small><em>Para organismos nacionales e internacionales</em></span><span class="stat"><b>4</b><small>Años de docencia</small><em>Y tutoría académica</em></span><span class="stat"><b>18</b><small>Artículos de Divulgación</small><em>Sobre políticas públicas y desarrollo sostenible</em></span></span>'''
    imageUrl = "/images/profile.jpg"
    imageWidth = 150
    imageHeight = 150
    imageTitle = "Albert Ponce Villegas"

    [[params.profileMode.buttons]]
      name = "👤 Sobre mí"
      url = "about"
    [[params.profileMode.buttons]]
      name = "🏢 Experiencia"
      url = "experience"
    [[params.profileMode.buttons]]
      name = "📚 Investigación"
      url = "research"
    [[params.profileMode.buttons]]
      name = "💼 Consultoría"
      url = "consultancy"
    [[params.profileMode.buttons]]
      name = "🎓 Docencia"
      url = "teaching"
    [[params.profileMode.buttons]]
      name = "🚀 Proyectos"
      url = "projects"

  # Enlaces sociales (aparecen bajo el perfil)
  [[params.socialIcons]]
    name = "email"
    title = "Correo electrónico"
    url = "mailto:alb.ponce96@gmail.com"
  [[params.socialIcons]]
    name = "linkedin"
    title = "LinkedIn"
    url = "https://www.linkedin.com/in/albert-ponce-villegas-a3966168/"
  [[params.socialIcons]]
    name = "googlescholar"
    title = "Google Scholar"
    url = "https://scholar.google.com/citations?user=l4y-ybsAAAAJ&hl=es"
  [[params.socialIcons]]
    name = "medium"
    title = "Medium"
    url = "https://albponce.medium.com"
  [[params.socialIcons]]
    name = "cv"
    title = "Conoce mi CV (PDF)"
    url = "/cv.pdf"

